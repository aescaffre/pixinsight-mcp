name: pixmetrics (native metrics)
on:
  push:
    paths: ['native/pixmetrics/**', '.github/workflows/pixmetrics.yml']
  pull_request:
    paths: ['native/pixmetrics/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon
            target: aarch64-apple-darwin
            exe: pixmetrics
          - os: macos-13          # Intel
            target: x86_64-apple-darwin
            exe: pixmetrics
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: pixmetrics.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: pixmetrics
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/pixmetrics
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Smoke test (list metrics)
        run: ./target/${{ matrix.target }}/release/${{ matrix.exe }} list
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: pixmetrics-${{ matrix.target }}
          path: native/pixmetrics/target/${{ matrix.target }}/release/${{ matrix.exe }}
